trigger:
  - Teste_da_Pipeline

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: "Build e Push para ACR"
    jobs:
      - job: BuildAndPush
        steps:
          - task: Docker@2
            displayName: "Build e Push da Imagem"
            inputs:
              containerRegistry: "pythonmssqlmr560210"
              repository:        "pythonsql"

              command:           "buildAndPush"
              Dockerfile:        "**/Dockerfile"
              tags: |
                $(Build.BuildId)
                latest